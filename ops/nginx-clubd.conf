server {
    listen 80;
    listen [::]:80;

    server_name clubd.in www.clubd.in 200.141.7.165;

    root /var/www/clubd;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
